name: Build .Netic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: apktool & aapt/zipalign/apksigner installieren
        run: |
          sudo curl -L -o /usr/local/bin/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.2/apktool_3.0.2.jar
          {
            echo '#!/bin/bash'
            echo 'java -Xmx4096m -jar /usr/local/bin/apktool.jar "$@"'
          } | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool

          mkdir -p "$HOME/android-sdk"
          cd "$HOME/android-sdk"
          curl -L -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          chmod +x cmdline-tools/bin/sdkmanager

          yes | ./cmdline-tools/bin/sdkmanager --sdk_root="$HOME/android-sdk" --licenses > /dev/null 2>&1 || true
          yes | ./cmdline-tools/bin/sdkmanager --sdk_root="$HOME/android-sdk" "build-tools;34.0.0" > /dev/null 2>&1

          echo "PATH=$PATH:$HOME/android-sdk/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Neuestes Cromite-APK herunterladen (arm64 + arm)
        run: |
          curl -L -o cromite.apk https://github.com/uazo/cromite/releases/latest/download/arm64_ChromePublic.apk
          curl -L -o cromite-arm.apk https://github.com/uazo/cromite/releases/latest/download/arm_ChromePublic.apk

      - name: APK entpacken
        run: |
          apktool d cromite.apk -o netic-src -f
          apktool d cromite-arm.apk -o netic-src-arm -f

      - name: 32-Bit-ARM-Libs mergen (Fat APK für mehr Geräte)
        run: |
          # x86/x86_64 bietet Cromite im aktuellen Release nicht an - kann daher
          # nicht mit eingebaut werden. arm + arm64 deckt praktisch alle echten
          # Android-Telefone ab.
          mkdir -p netic-src/lib
          if [ -d netic-src-arm/lib ]; then
            cp -r netic-src-arm/lib/. netic-src/lib/
          fi
          echo "Enthaltene ABIs:"; ls netic-src/lib

      - name: AndroidManifest.xml bereinigen & Paket/Name umbenennen
        run: |
          # apktool 3.0.2 schreibt den Android-Namespace nicht als "android:",
          # sondern als generischen Alias (hier "n0:"). Deshalb generisch auf
          # ein beliebiges Namespace-Präfix (\w+:) matchen.
          #
          # 1) Nur Attribute entfernen (s///), NICHT ganze Zeilen löschen (/d) -
          #    sonst reißt man das schließende ">"/"/>" mit raus und die XML
          #    bricht (führt zu "manifest must be terminated").
          sed -i -E 's/[[:space:]]*[A-Za-z0-9]+:zygotePreloadNativeLib="[^"]*"//g' netic-src/AndroidManifest.xml
          sed -i -E 's/[[:space:]]*[A-Za-z0-9]+:nativeService="[^"]*"//g' netic-src/AndroidManifest.xml

          # 2) Paketname umbenennen. Bestätigt per Binäranalyse: package blieb
          #    bislang "org.cromite.cromite" - Kollisionsgefahr mit echtem
          #    Cromite und Teil des Rebranding-Bugs.
          sed -i -E 's/package="org\.cromite\.cromite"/package="ws.ct.pcsproduction.netic"/' netic-src/AndroidManifest.xml

          # 3) App-Label umbenennen. Bestätigt per Binäranalyse: android:label
          #    steht als Literal "Cromite" direkt im Manifest (keine
          #    @string/app_name-Referenz) - deshalb griff das reine
          #    strings.xml-Ersetzen bisher nicht für den Anzeigenamen.
          sed -i -E 's/([A-Za-z0-9]+:label)="Cromite"/\1=".Netic"/g' netic-src/AndroidManifest.xml

          remaining=$(grep -c -E '[A-Za-z0-9]+:(zygotePreloadNativeLib|nativeService)=' netic-src/AndroidManifest.xml || true)
          echo "Verbleibende native-Attribute nach Bereinigung: $remaining"
          if [ "$remaining" -ne 0 ]; then
            echo "::error::Manifest-Bereinigung fehlgeschlagen, Attribute noch vorhanden"
            grep -n -E '[A-Za-z0-9]+:(zygotePreloadNativeLib|nativeService)=' netic-src/AndroidManifest.xml
            exit 1
          fi

          remaining_pkg=$(grep -c 'org\.cromite\.cromite' netic-src/AndroidManifest.xml || true)
          echo "Verbleibende Cromite-Paketverweise im Manifest: $remaining_pkg"
          remaining_label=$(grep -c '"Cromite"' netic-src/AndroidManifest.xml || true)
          echo "Verbleibendes 'Cromite'-Label im Manifest: $remaining_label"

      - name: Manifest auf Wohlgeformtheit prüfen
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('netic-src/AndroidManifest.xml')"

      - name: App-Name & Strings ersetzen
        run: |
          find netic-src/res/values* -name "strings.xml" -exec sed -i \
            -e 's/Chromium/.Netic/g' \
            -e 's/Cromite/.Netic/g' {} \;

      - name: Farben (dunkelblau/Netzwerk-Theme) setzen
        run: |
          find netic-src/res/values* -name "colors.xml" | while read f; do
            sed -i \
              -e 's/name="default_primary_color">#[0-9A-Fa-f]*/name="default_primary_color">#0e2670/' \
              -e 's/name="toolbar_background">#[0-9A-Fa-f]*/name="toolbar_background">#050a1e/' \
              "$f" || true
          done

      - name: Icon austauschen
        run: |
          # Bestätigt per Analyse: ic_launcher.png wird in allen Dichte-Ordnern
          # verwendet (auch vom Adaptive-Icon), reines Überschreiben reicht hier.
          for dir in netic-src/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp assets/netic-icon.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp assets/netic-icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
            fi
          done

      - name: Manifest vor dem Bauen prüfen (Diagnose)
        run: |
          echo "--- Suche nach den nativen Attributen ---"
          grep -n -E '[A-Za-z0-9]+:(zygotePreloadNativeLib|nativeService)=' netic-src/AndroidManifest.xml || echo "keine Treffer"
          echo "--- Paketname im Manifest ---"
          grep -n 'package=' netic-src/AndroidManifest.xml | head -1

      - name: APK neu bauen
        run: |
          apktool b netic-src -o netic-unsigned.apk

      - name: APK ausrichten (zipalign, vor dem Signieren)
        run: |
          zipalign -v -p 4 netic-unsigned.apk netic-aligned.apk

      - name: Signierschlüssel laden oder erzeugen
        run: |
          if [ -n "${{ secrets.NETIC_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.NETIC_KEYSTORE_BASE64 }}" | base64 -d > netic.keystore
          else
            if [ -z "$NETIC_PW" ] || [ "${#NETIC_PW}" -lt 6 ]; then
              echo "::error::NETIC_KEYSTORE_PASSWORD fehlt oder ist kürzer als 6 Zeichen."
              exit 1
            fi
            echo "::warning::Kein NETIC_KEYSTORE_BASE64-Secret gefunden, erzeuge neuen (nicht persistenten) Keystore."
            keytool -genkeypair -v -keystore netic.keystore -alias neticbrowser \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$NETIC_PW" \
              -keypass "$NETIC_PW" \
              -dname "CN=Netic, OU=Netic, O=Netic, L=, S=, C=DE"
          fi
        env:
          NETIC_PW: ${{ secrets.NETIC_KEYSTORE_PASSWORD }}

      - name: APK signieren (apksigner, v1+v2+v3)
        run: |
          # Bestätigt per Binäranalyse: die alte jarsigner-Signatur enthielt
          # KEINEN v2/v3-Block. Bei targetSdkVersion 36 verlangt Android einen
          # v2/v3-Signaturblock - ohne ihn kommt "Paket ist ungültig".
          apksigner sign --ks netic.keystore \
            --ks-pass pass:"${{ secrets.NETIC_KEYSTORE_PASSWORD }}" \
            --ks-key-alias neticbrowser \
            --out netic-final.apk \
            netic-aligned.apk
          apksigner verify --print-certs netic-final.apk

      - name: APK als Build-Ergebnis hochladen
        uses: actions/upload-artifact@v4
        with:
          name: netic-browser-apk
          path: netic-final.apk

